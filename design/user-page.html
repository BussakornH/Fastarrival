<title>Fast Arrival</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap">
<style>
/* Layout: the map is the app. Floating search + layer chips top-left (Google), control stack top-right (Apple),
   Map/Satellite tile bottom-left (Google), zoom under the controls. Picking a place opens the arrival card:
   left panel on desktop (Apple place card), bottom sheet on phones. */
:root{
  --chrome:#FFFFFF; --chrome-2:#F2F2F5; --ink:#1D1D1F; --muted:#6E6E73; --rule:#E3E3E8;
  --blue:#0071E3; --blue-hover:#0077ED; --on-blue:#FFFFFF; --blue-soft:#E8F1FD;
  --good:#1E8E3E; --warn:#E37400; --bad:#D93025; --good-soft:#E6F4EA; --warn-soft:#FEF3E2; --rail:#7A5AF8;
  --shadow:0 2px 10px rgba(0,0,0,.14), 0 0 0 .5px rgba(0,0,0,.06);
  --m-land:#F2EFE9; --m-block:#E8E4DC; --m-water:#9CC8F0; --m-park:#C5E3BC; --m-road:#FFFFFF; --m-edge:#D9D4CB;
  --m-major:#FFE9A8; --m-major-edge:#E5C770; --m-label:#5F6368; --m-label-strong:#3C4043; --m-halo:rgba(255,255,255,.9);
  --font:"Inter","SF Pro Text",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --chrome:#1C1C1E; --chrome-2:#2C2C2E; --ink:#F5F5F7; --muted:#A1A1A6; --rule:#3A3A3C;
  --blue:#0A84FF; --blue-hover:#3395FF; --blue-soft:#0B2847;
  --good:#30D158; --warn:#FF9F0A; --bad:#FF453A; --good-soft:#0F2E1A; --warn-soft:#33240A; --rail:#9D85FF;
  --shadow:0 2px 12px rgba(0,0,0,.5), 0 0 0 .5px rgba(255,255,255,.08);
  --m-land:#212326; --m-block:#26292D; --m-water:#1B3550; --m-park:#1E3324; --m-road:#3B3F45; --m-edge:#2A2D31;
  --m-major:#5B5243; --m-major-edge:#3E392F; --m-label:#9AA0A6; --m-label-strong:#C8CCD0; --m-halo:rgba(20,22,25,.85); color-scheme:dark}}
:root[data-theme="dark"]{
  --chrome:#1C1C1E; --chrome-2:#2C2C2E; --ink:#F5F5F7; --muted:#A1A1A6; --rule:#3A3A3C;
  --blue:#0A84FF; --blue-hover:#3395FF; --blue-soft:#0B2847;
  --good:#30D158; --warn:#FF9F0A; --bad:#FF453A; --good-soft:#0F2E1A; --warn-soft:#33240A; --rail:#9D85FF;
  --shadow:0 2px 12px rgba(0,0,0,.5), 0 0 0 .5px rgba(255,255,255,.08);
  --m-land:#212326; --m-block:#26292D; --m-water:#1B3550; --m-park:#1E3324; --m-road:#3B3F45; --m-edge:#2A2D31;
  --m-major:#5B5243; --m-major-edge:#3E392F; --m-label:#9AA0A6; --m-label-strong:#C8CCD0; --m-halo:rgba(20,22,25,.85); color-scheme:dark}
#map.sat{--m-land:#3A4232; --m-block:#5A5C55; --m-water:#1D3940; --m-park:#26411F; --m-road:rgba(226,224,214,.5); --m-edge:transparent;
  --m-major:rgba(244,238,220,.75); --m-major-edge:transparent; --m-label:#FFFFFF; --m-label-strong:#FFFFFF; --m-halo:rgba(0,0,0,.65)}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--m-land);color:var(--ink);font:400 15px/1.4 var(--font);letter-spacing:-.01em;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit;letter-spacing:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

#map{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;background:var(--m-land);user-select:none;-webkit-user-select:none}
#map.dragging{cursor:grabbing}
.land{fill:var(--m-land)} .block{fill:var(--m-block)} .park{fill:var(--m-park)}
.r-edge{fill:none;stroke:var(--m-edge);stroke-linecap:round;stroke-linejoin:round}
.r{fill:none;stroke:var(--m-road);stroke-linecap:round;stroke-linejoin:round}
.r-major-edge{fill:none;stroke:var(--m-major-edge);stroke-linecap:round;stroke-linejoin:round}
.r-major{fill:none;stroke:var(--m-major);stroke-linecap:round;stroke-linejoin:round}
.tseg{fill:none;stroke-linecap:round;opacity:.85}
.railx{fill:none;stroke:var(--rail);stroke-linecap:round;stroke-linejoin:round;opacity:.75}
.lbl{fill:var(--m-label);font:500 12px var(--font);paint-order:stroke;stroke:var(--m-halo);stroke-width:3px;stroke-linejoin:round;letter-spacing:.02em}
.lbl.dist{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.12em;opacity:.8}
.lbl.road{font-size:11px}
.lbl.river{fill:#4A7FB5;font-style:italic;stroke:none}
#map.sat .lbl.river{fill:#9CC8F0}
.satlayer{display:none} #map.sat .satlayer{display:inline}
.rain{fill:#2F80ED;transition:opacity .4s}
.rt-casing{fill:none;stroke:#FFFFFF;stroke-linecap:round;stroke-linejoin:round}
.rt{fill:none;stroke-linecap:round;stroke-linejoin:round}
.rt-walk{fill:none;stroke:var(--muted);stroke-width:4;stroke-dasharray:1 8;stroke-linecap:round}
#map.sat .rt-walk{stroke:#fff}

#markers{position:fixed;inset:0;pointer-events:none}
.mk{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;display:flex;flex-direction:column;align-items:center;border:0;background:none;padding:0}
.mk .dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--chrome);color:var(--ink);box-shadow:var(--shadow);border:2px solid var(--chrome)}
.mk .dot svg{width:15px;height:15px}
.mk.saved .dot{color:#F5A623}
.mk .name{margin-top:3px;font-size:12px;font-weight:600;color:var(--m-label-strong);text-shadow:0 0 3px var(--m-halo),0 0 3px var(--m-halo),0 0 3px var(--m-halo);white-space:nowrap}
#map.sat ~ #markers .mk .name{color:#fff;text-shadow:0 0 3px #000,0 0 3px #000}
.mk .eta{position:absolute;bottom:calc(100% + 2px);left:50%;transform:translateX(-50%);background:var(--chrome);color:var(--ink);font-size:12px;font-weight:600;padding:3px 8px;border-radius:99px;box-shadow:var(--shadow);white-space:nowrap;font-variant-numeric:tabular-nums}
.mk .eta b{color:var(--blue);font-weight:600}
.me{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;cursor:pointer;border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center}
.me .d{width:20px;height:20px;border-radius:50%;background:var(--blue);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);position:relative}
.me .d::after{content:"";position:absolute;inset:-14px;border-radius:50%;background:var(--blue);opacity:.18;animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{transform:scale(.45);opacity:.35}100%{transform:scale(1.35);opacity:0}}
.me .name{position:absolute;top:22px;font-size:12px;font-weight:600;white-space:nowrap;color:var(--m-label-strong);text-shadow:0 0 3px var(--m-halo),0 0 3px var(--m-halo),0 0 3px var(--m-halo)}
#map.sat ~ #markers .me .name{color:#fff;text-shadow:0 0 3px #000,0 0 3px #000}
.pin{position:absolute;transform:translate(-50%,-100%);pointer-events:none}
.pin svg{width:34px;height:44px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3));display:block}
.pin.drop{animation:drop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes drop{from{transform:translate(-50%,-160%)}to{transform:translate(-50%,-100%)}}
.bubble{position:absolute;transform:translate(-50%,-50%);pointer-events:none;background:var(--chrome);color:var(--ink);font-size:13px;font-weight:600;padding:5px 10px;border-radius:10px;box-shadow:var(--shadow);white-space:nowrap;font-variant-numeric:tabular-nums;display:flex;gap:6px;align-items:center}
.bubble svg{width:15px;height:15px;color:var(--blue)}
.mover{position:absolute;transform:translate(-50%,-50%);width:18px;height:18px;border-radius:50%;background:var(--blue);border:3px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.4);pointer-events:none}

.top{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));right:calc(env(safe-area-inset-right,0px) + 64px);display:flex;gap:10px;align-items:flex-start;pointer-events:none;z-index:7}
.search{pointer-events:auto;width:380px;max-width:100%;position:relative;flex:none}
.sbox{display:flex;align-items:center;gap:8px;background:var(--chrome);border-radius:24px;box-shadow:var(--shadow);height:48px;padding:0 6px 0 16px}
.sbox>svg{width:18px;height:18px;color:var(--muted);flex:none}
.sbox input{flex:1;min-width:0;border:0;background:transparent;font-size:16px;height:100%}
.sbox input:focus{outline:none}
.sclear{border:0;background:none;width:32px;height:32px;border-radius:50%;cursor:pointer;color:var(--muted);display:grid;place-items:center}
.sclear svg{width:14px;height:14px}
.sugg{position:absolute;top:56px;left:0;right:0;background:var(--chrome);border-radius:16px;box-shadow:var(--shadow);padding:6px;max-height:min(60vh,440px);overflow:auto}
.sugg h4{margin:8px 10px 4px;font-size:12px;font-weight:600;color:var(--muted)}
.sugg button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:10px;cursor:pointer}
.sugg button:hover,.sugg button.act{background:var(--chrome-2)}
.sugg .si{width:30px;height:30px;border-radius:50%;background:var(--chrome-2);display:grid;place-items:center;flex:none}
.sugg .si svg{width:15px;height:15px}
.sugg b{display:block;font-weight:500;font-size:15px}
.sugg span.s{display:block;font-size:12px;color:var(--muted)}
.chips{display:flex;gap:8px;pointer-events:auto;overflow-x:auto;scrollbar-width:none;padding:4px 2px 8px;min-width:0}
.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:18px;border:0;background:var(--chrome);box-shadow:var(--shadow);font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap}
.chip svg{width:16px;height:16px}
.chip[aria-pressed="true"]{background:var(--blue-soft);color:var(--blue)}
@media (max-width:720px){.top{flex-direction:column;gap:6px;right:max(12px,env(safe-area-inset-right,0px))}.search{width:100%}.chips{width:100%}}

.remind-strip{position:fixed;z-index:7;top:calc(70px + env(safe-area-inset-top,0px));right:calc(env(safe-area-inset-right,0px) + 64px);background:var(--chrome);box-shadow:var(--shadow);border-radius:14px;padding:8px 8px 8px 12px;display:flex;align-items:center;gap:10px;font-size:13px;max-width:320px}
.remind-strip>svg{width:16px;height:16px;color:var(--blue);flex:none}
.remind-strip b{font-weight:600}
.remind-strip button{border:0;background:var(--chrome-2);border-radius:50%;width:24px;height:24px;display:grid;place-items:center;cursor:pointer;color:var(--muted);flex:none}
.remind-strip button svg{width:11px;height:11px}
@media (max-width:720px){.remind-strip{top:calc(116px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));right:64px;max-width:none}}

.ctrl{position:fixed;right:max(12px,env(safe-area-inset-right,0px));z-index:6;display:flex;flex-direction:column;background:var(--chrome);border-radius:10px;box-shadow:var(--shadow);overflow:hidden}
.ctrl button{width:42px;height:42px;border:0;background:none;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.ctrl button+button{border-top:1px solid var(--rule)}
.ctrl button:hover{background:var(--chrome-2)}
.ctrl svg{width:18px;height:18px}
#ctrl-top{top:calc(12px + env(safe-area-inset-top,0px))}
#ctrl-zoom{top:calc(110px + env(safe-area-inset-top,0px))}
@media (max-width:720px){#ctrl-top{top:calc(116px + env(safe-area-inset-top,0px))}#ctrl-zoom{top:calc(214px + env(safe-area-inset-top,0px))}}

.layer{position:fixed;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));z-index:5;width:72px;height:72px;border-radius:12px;border:2px solid #fff;box-shadow:var(--shadow);cursor:pointer;padding:0;overflow:hidden;display:flex;align-items:flex-end;transition:bottom .3s}
.layer span{width:100%;font-size:12px;font-weight:600;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.6));padding:14px 6px 5px;text-align:left;display:flex;gap:4px;align-items:center}
.layer span svg{width:13px;height:13px}
.layer.to-sat{background:radial-gradient(circle at 30% 30%,#56603F 0 18%,transparent 19%),radial-gradient(circle at 70% 65%,#2F4A2A 0 22%,transparent 23%),linear-gradient(135deg,#4A5340,#66695C 45%,#3D4A35)}
.layer.to-map{background:linear-gradient(90deg,transparent 46%,#FFE9A8 46% 54%,transparent 54%),linear-gradient(0deg,transparent 40%,#fff 40% 46%,transparent 46%),radial-gradient(circle at 75% 25%,#C5E3BC 0 20%,transparent 21%),linear-gradient(160deg,#F2EFE9,#E8E4DC)}
.layer.to-map span{color:#1D1D1F;background:linear-gradient(transparent,rgba(255,255,255,.85))}
.attrib{position:fixed;right:max(8px,env(safe-area-inset-right,0px));bottom:calc(4px + env(safe-area-inset-bottom,0px));z-index:4;font-size:10px;color:var(--m-label);background:var(--m-halo);padding:2px 6px;border-radius:4px}

.card{position:fixed;z-index:6;background:var(--chrome);box-shadow:0 8px 30px rgba(0,0,0,.18),0 0 0 .5px rgba(0,0,0,.06);display:flex;flex-direction:column;overflow:hidden}
@media (min-width:721px){.card{left:max(12px,env(safe-area-inset-left,0px));top:calc(72px + env(safe-area-inset-top,0px));width:384px;max-height:calc(100% - 96px - env(safe-area-inset-top,0px));border-radius:18px}
  .card:not([hidden]) ~ .layer{left:410px} .handle{display:none!important}}
@media (max-width:720px){.card{left:0;right:0;bottom:0;border-radius:18px 18px 0 0;max-height:min(84%,700px);padding-bottom:env(safe-area-inset-bottom,0px);transition:max-height .3s ease}
  .card.peek{max-height:196px}
  .card:not([hidden]) ~ .layer{bottom:calc(210px + env(safe-area-inset-bottom,0px))}
  .card:not([hidden]) ~ .attrib{display:none}}
.handle{width:100%;height:22px;border:0;background:none;display:grid;place-items:center;cursor:pointer;flex:none}
.handle::before{content:"";width:38px;height:5px;border-radius:3px;background:var(--rule)}
.cscroll{overflow-y:auto;padding:16px 18px 18px;display:flex;flex-direction:column;gap:14px}
.cscroll>*{flex-shrink:0}
@media (max-width:720px){.cscroll{padding-top:2px}}
.chead{display:flex;gap:10px;align-items:flex-start}
.chead h2{font-size:21px;font-weight:700;letter-spacing:-.02em;margin:0;line-height:1.15}
.chead p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.chead>div{flex:1;min-width:0}
.x{width:30px;height:30px;border-radius:50%;border:0;background:var(--chrome-2);display:grid;place-items:center;cursor:pointer;flex:none;color:var(--muted)}
.x svg{width:13px;height:13px}
.answer{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.answer .lab{font-size:13px;font-weight:600;color:var(--muted)}
.answer .big{font-size:54px;font-weight:700;letter-spacing:-.035em;line-height:.95;font-variant-numeric:tabular-nums}
.answer .side{text-align:right;font-size:13px;color:var(--muted);padding-bottom:4px}
.answer .side b{display:block;color:var(--ink);font-size:15px;font-weight:600}
.wtrack{position:relative;height:6px;background:var(--chrome-2);border-radius:3px}
.wband{position:absolute;top:0;bottom:0;background:var(--blue);opacity:.28;border-radius:3px}
.wmid{position:absolute;top:-4px;width:2px;height:14px;background:var(--blue);border-radius:1px}
.wgoal{position:absolute;top:-7px;height:20px;border-left:2px dashed var(--ink)}
.wticks{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mode{border:0;background:var(--chrome-2);border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.mode svg{width:20px;height:20px}
.mode b{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.mode small{font-size:11px;color:var(--muted)}
.mode[aria-pressed="true"]{background:var(--blue);color:var(--on-blue)}
.mode[aria-pressed="true"] small{color:var(--on-blue);opacity:.85}
.tip{display:flex;gap:10px;align-items:center;background:var(--warn-soft);border-radius:12px;padding:10px 10px 10px 12px;font-size:13px}
.tip.good{background:var(--good-soft)}
.tip>div{flex:1;min-width:0}
.tip b{display:block;font-size:14px}
.tip .use{border:0;background:var(--chrome);border-radius:99px;padding:6px 12px;font-weight:600;font-size:13px;color:var(--blue);cursor:pointer;flex:none}
.rowset{border-radius:12px;background:var(--chrome-2);overflow:hidden}
.rowx{display:flex;align-items:center;gap:10px;padding:10px 12px;font-size:14px}
.rowx+.rowx{border-top:1px solid var(--rule)}
.rowx .k{color:var(--muted);width:42px;flex:none;font-size:13px}
.rowx .v{flex:1;min-width:0;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowx .link{border:0;background:none;color:var(--blue);font-weight:500;cursor:pointer;padding:0;font-size:14px;flex:none}
.seg{display:inline-grid;grid-template-columns:1fr 1fr;background:var(--rule);border-radius:8px;padding:2px;flex:none}
.seg button{border:0;background:transparent;padding:4px 10px;border-radius:6px;cursor:pointer;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--chrome);box-shadow:0 1px 2px rgba(0,0,0,.15);font-weight:600}
.timer{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.timer output{font-weight:600;font-variant-numeric:tabular-nums;min-width:42px}
.timer input{flex:1;min-width:0;accent-color:var(--blue)}
.sigs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.sig{background:var(--chrome-2);border-radius:12px;padding:10px 12px;min-width:0}
.sig .k{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sig .k svg{width:14px;height:14px;flex:none}
.sig .k i{margin-left:auto;font-style:normal;font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:1px 6px;border-radius:99px}
.sig .k i.real{background:var(--good-soft);color:var(--good)}
.sig .k i.model{background:var(--chrome);color:var(--muted)}
.sig .v{font-size:19px;font-weight:700;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.sig .s{font-size:12px;color:var(--muted);margin-top:1px;line-height:1.35}
.primary{border:0;background:var(--blue);color:var(--on-blue);border-radius:12px;height:48px;font-size:16px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.primary:hover{background:var(--blue-hover)}
.primary svg{width:18px;height:18px}
.primary.done{background:var(--chrome-2);color:var(--ink)}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.act{border:0;background:var(--chrome-2);border-radius:12px;padding:10px 2px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:500;color:var(--blue);cursor:pointer;text-align:center}
.act svg{width:18px;height:18px}
.act[aria-pressed="true"]{color:#C77700}
.copybox{width:100%;border:1px solid var(--rule);border-radius:8px;padding:8px;font-size:12px;background:var(--chrome-2)}
.note{font-size:11px;color:var(--muted);line-height:1.45;margin:0}
.empty{font-size:15px;color:var(--muted);padding:4px 0;margin:0}
.trip{display:flex;flex-direction:column;gap:8px;background:var(--blue-soft);border-radius:12px;padding:12px}
.trip .tt{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted)}
.trip .tt b{font-size:22px;color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.trip .bar{height:6px;border-radius:3px;background:var(--chrome);overflow:hidden}
.trip .bar span{display:block;height:100%;background:var(--blue);width:0}
.toast{position:fixed;left:50%;top:calc(80px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:9;background:#1D1D1F;color:#fff;font-size:13px;font-weight:500;padding:8px 14px;border-radius:99px;box-shadow:var(--shadow);pointer-events:none;max-width:calc(100% - 32px);text-align:center}
@media (max-width:720px){.toast{top:calc(120px + env(safe-area-inset-top,0px))}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<svg id="map" aria-label="Map of central Bangkok. Drag to move, pinch or scroll to zoom, tap to pick a place.">
  <defs>

  const t = ((p3[0]-p1[0])*(p4[1]-p3[1]) - (p3[1]-p1[1])*(p4[0]-p3[0]))/d, u = ((p3[0]-p1[0])*(p2[1]-p1[1]) - (p3[1]-p1[1])*(p2[0]-p1[0]))/d;
  return (t>1e-6 && t<1-1e-6 && u>=-1e-6 && u<=1+1e-6) ? t : null; }
function buildGraph(lines, perLine){

  for (let a=0;a<lines.length;a++) for (let b=0;b<lines.length;b++){ if (a===b) continue; const A = lines[a], B = lines[b];
    for (let i=0;i<A.length-1;i++) for (let j=0;j<B.length-1;j++){ const t = segX(A[i],A[i+1],B[j],B[j+1]); if (t!==null) cuts[a][i].push(t); } }
  lines.forEach((l, li) => { const tag = perLine ? '#'+li : '';
    for (let i=0;i<l.length-1;i++){ const [x1,y1] = l[i], [x2,y2] = l[i+1], ts = [0, ...cuts[li][i].sort((a,b)=>a-b), 1];
      for (let k=0;k<ts.length-1;k++){ const ax = x1+(x2-x1)*ts[k], ay = y1+(y2-y1)*ts[k], bx = x1+(x2-x1)*ts[k+1], by = y1+(y2-y1)*ts[k+1];
        const u = nid(ax,ay,tag), v = nid(bx,by,tag); if (u===v) continue;
        const e = {u, v, len:Math.hypot(bx-ax, by-ay)*KM, line:li}; edges.push(e); adj[u].push({to:v, e}); adj[v].push({to:u, e}); } } });
  if (perLine){ const byPos = new Map();
    nodes.forEach((n,i) => { const k = Math.round(n.x/4)+','+Math.round(n.y/4); if (!byPos.has(k)) byPos.set(k, []); byPos.get(k).push(i); });
    for (const ids of byPos.values()) for (const a of ids) for (const b of ids) if (a!==b) adj[a].push({to:b, e:{u:a, v:b, len:0, line:-1, transfer:true}}); }

}
const ROAD_G = buildGraph(ROADS.map(r => r[1]), false);
const RAIL_G = buildGraph(RAIL.map(r => r[1]), true);
const ROAD_INFO = ROADS.map(([n,p,c,w]) => ({n, c, w}));
function snap(G, x, y, ok){ let best = null;
  for (const e of G.edges){ if (ok && !ok(e)) continue; const a = G.nodes[e.u], b = G.nodes[e.v], dx = b.x-a.x, dy = b.y-a.y, L2 = dx*dx+dy*dy || 1;
    const f = Math.max(0, Math.min(1, ((x-a.x)*dx + (y-a.y)*dy)/L2)), px = a.x+dx*f, py = a.y+dy*f, d = Math.hypot(px-x, py-y);

function dijkstra(G, s, t, cost){
  const n = G.nodes.length, dist = new Float64Array(n).fill(Infinity), prev = new Int32Array(n).fill(-1), pe = new Array(n), heap = [];
  const push = (d,i) => { heap.push([d,i]); let k = heap.length-1; while (k>0){ const p = (k-1)>>1; if (heap[p][0] <= heap[k][0]) break; [heap[p],heap[k]] = [heap[k],heap[p]]; k = p; } };

    for (const {to, e} of G.adj[i]){ const nd = d + cost(e); if (nd < dist[to]){ dist[to] = nd; prev[to] = i; pe[to] = e; push(nd, to); } } }

/* ===== Trip estimates ===== */
const MODES = [{id:'car', name:'Car', icon:'car'}, {id:'rail', name:'Train', icon:'rail'}, {id:'moto', name:'Motorbike', icon:'moto'}, {id:'bus', name:'Bus', icon:'bus'}];
const SPEED = {car:{x:62,m:30,n:24,jam:1.7,rainF:.22,fixed:3,spread:.16}, moto:{x:0,m:33,n:28,jam:.55,rainF:.45,fixed:2,spread:.14}, bus:{x:0,m:21,n:17,jam:1.35,rainF:.18,fixed:7,spread:.22}};
let cal = 1; // set below so Home → Office by car, leaving 07:50, takes 51 min (matches the Figma screens)
function roadTrip(mode, a, b, t){
  const sp = SPEED[mode], j = jamAt(t), r = rainChance(t);
  const speedOf = e => { const c = ROAD_INFO[e.line].c; return c === 'x' ? sp.x : c === 'm' ? sp.m : sp.n; };
  const cost = e => { const v = speedOf(e); return v ? e.len/v*60*(1 + sp.jam*j*ROAD_INFO[e.line].w) : 1e6; };
  const usable = e => speedOf(e) > 0, sa = snap(ROAD_G, a.x, a.y, usable), sb = snap(ROAD_G, b.x, b.y, usable), res = dijkstra(ROAD_G, sa, sb, cost);

  for (const {e, frac} of res.parts){ const v = speedOf(e) || sp.n; free += e.len*frac/v*60; km += e.len*frac; }
  const ends = (sa.d + sb.d)*KM, endMin = ends/sp.n*60; km += ends;
  const dist = (free + endMin + sp.fixed)*cal, jam = Math.max(0, res.cost - free)*cal, rain = r*sp.rainF*(dist+jam), mid = dist + jam + rain;
  const geo = [[a.x,a.y],[sa.x,sa.y], ...res.path.map(i => [ROAD_G.nodes[i].x, ROAD_G.nodes[i].y]), [sb.x,sb.y],[b.x,b.y]];

function railTrip(a, b, t){

  return {mode:'rail', mid, lo:mid*.95, hi:mid*1.08, parts:{dist, jam:0, rain}, km:ride + walkKm, j:0, r, geo, walk:[[[a.x,a.y],[sa.x,sa.y]],[[sb.x,sb.y],[b.x,b.y]]]};

const trip = (mode, a, b, t) => mode === 'rail' ? railTrip(a,b,t) : roadTrip(mode,a,b,t);
cal = 51 / roadTrip('car', PLACES[0], PLACES[1], 470).mid;

/* ===== State ===== */
const S = {view:{k:1,tx:0,ty:0}, sat:false, traffic:true, rain:false, rail:true, sel:null, from:{...PLACES[0]}, mode:'car', type:'leave', t:470, arrive:540, sheetFull:false, preview:null};
let REMINDERS = store.get('reminders', []);
const allPlaces = () => [...PLACES, ...SAVED.map(s => ({...s, savedPin:true}))];

/* ===== View ===== */
const isPhone = () => innerWidth <= 720;
function applyView(){ const {k,tx,ty} = S.view; world.setAttribute('transform', `translate(${tx} ${ty}) scale(${k})`); placeOverlays(); }
const toWorld = (sx,sy) => ({x:(sx - S.view.tx)/S.view.k, y:(sy - S.view.ty)/S.view.k});
const toScreen = (x,y) => ({x: x*S.view.k + S.view.tx, y: y*S.view.k + S.view.ty});
function visibleRect(){
  if (isPhone()) return {l:24, t:180, r:innerWidth-64, b:innerHeight - (S.sel ? (S.sheetFull ? innerHeight*.84 : 196) : 0) - 30};
  return {l:(S.sel ? 410 : 12) + 30, t:90, r:innerWidth-70, b:innerHeight-36};
}
function fitBounds(xs, ys, maxK){

  S.view.k = k; S.view.tx = (v.l+v.r)/2 - (minX+maxX)/2*k; S.view.ty = (v.t+v.b)/2 - (minY+maxY)/2*k; applyView();
}
const fitAll = () => fitBounds([400,1300],[90,1000], 1.6);
function zoomAt(f, sx, sy){ const k2 = Math.max(.35, Math.min(4.5, S.view.k*f)); const w = toWorld(sx,sy); S.view.k = k2; S.view.tx = sx - w.x*k2; S.view.ty = sy - w.y*k2; applyView(); }

/* ===== Overlays ===== */
const markers = $('markers');
function placeOverlays(){ markers.querySelectorAll('[data-x]').forEach(n => { const p = toScreen(+n.dataset.x, +n.dataset.y); n.style.left = p.x+'px'; n.style.top = p.y+'px'; }); }
function renderMarkers(){
  const o = S.from; let h = '';

    if (Math.hypot(p.x-o.x, p.y-o.y) < 8) continue;

/* ===== Layers ===== */
const jamColor = v => v > .62 ? 'var(--bad)' : v > .36 ? 'var(--warn)' : 'var(--good)';
function renderTraffic(){
  const g = $('traffic'); g.innerHTML = '';
  if (!S.traffic) return;
  const j = jamAt(S.t);
  for (const e of ROAD_G.edges){ const info = ROAD_INFO[e.line], v = j*info.w; if (v <= .68) continue; // only the worst jams, so your route stands out
    const a = ROAD_G.nodes[e.u], b = ROAD_G.nodes[e.v]; el('line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y,class:'tseg','stroke-width':info.c==='n'?2.5:3.5,style:`stroke:${jamColor(v)}`}, g); }
}

/* ===== Selecting ===== */
function nearestDistrict(x,y){ let best = DISTRICTS[0], d = 1e9; for (const D of DISTRICTS){ const dd = Math.hypot(D[1]-x, D[2]-y); if (dd < d){ d = dd; best = D; } } return best[0]; }
function selectAt(x,y){
  let hit = null, hd = 26/S.view.k;
  for (const p of allPlaces()){ const d = Math.hypot(p.x-x, p.y-y); if (d < hd){ hd = d; hit = p; } }

}
function select(p){ stopPreview(); S.sel = p; const card = $('card'); card.hidden = false; card.classList.toggle('peek', isPhone() && !S.sheetFull); renderAll(); fitRoute(); }
function fitRoute(){ if (!S.sel) return; const g = S.sel.geo || [[S.from.x,S.from.y],[S.sel.x,S.sel.y]]; fitBounds(g.map(p=>p[0]), g.map(p=>p[1]), 2.4); }
function closeCard(){ stopPreview(); S.sel = null; $('card').hidden = true; $('routeg').innerHTML=''; renderAll(); }

/* ===== Route ===== */
function lengthAlong(geo){ const seg = []; let L = 0; for (let i=0;i<geo.length-1;i++){ const l = Math.hypot(geo[i+1][0]-geo[i][0], geo[i+1][1]-geo[i][1]); seg.push(l); L += l; } return {seg, L}; }

  const g = $('routeg'); g.innerHTML = ''; if (!S.sel) return; S.sel.geo = null; S.sel.bub = null;

  const d = 'M' + q.geo.map(p=>p.join(' ')).join(' L');
  el('path',{d, class:'rt-casing','stroke-width':12}, g);
  if (q.mode === 'rail'){
    el('path',{d, class:'rt','stroke-width':7, style:'stroke:var(--rail)'}, g);
    for (const w of q.walk) el('path',{d:'M'+w.map(p=>p.join(' ')).join(' L'), class:'rt-walk'}, g);
  } else {
    el('path',{d, class:'rt','stroke-width':7, style:'stroke:var(--blue)'}, g);
    for (const e of q.edges){ const a = ROAD_G.nodes[e.u], b = ROAD_G.nodes[e.v], v = q.j*ROAD_INFO[e.line].w;
      if (v > .36) el('line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y,class:'rt','stroke-width':7,style:`stroke:${jamColor(v)}`}, g); }
  }
  S.sel.geo = q.walk ? [...q.walk[0], ...q.geo, ...q.walk[1]] : q.geo;
  const m = pointAlong(q.geo, .5); S.sel.bub = {x:m.x, y:m.y, text:`${Math.round(q.mid)} min`};

/* ===== Card ===== */
function departFor(mode, a, b){ if (S.type === 'leave') return S.t;
  for (let t = S.arrive - 5; t >= 300; t -= 5) if (t + trip(mode,a,b,t).hi <= S.arrive) return t; return 300; }
function bestDeparture(mode, a, b, around){ let best = {t:around, d:trip(mode,a,b,around).mid};
  for (let t = around-45; t <= around+15; t += 5){ if (t < 330 || t > 660) continue; const d = trip(mode,a,b,t).mid; if (d < best.d - .5) best = {t, d}; } return best; }

  if (!S.sel) return;
  const p = S.sel, o = S.from, body = $('cbody');
  const isSaved = SAVED.some(s => s.id === p.id) || p.saved;
  const straight = Math.hypot(p.x-o.x, p.y-o.y)*KM;
  const head = `<div class="chead"><div><h2>${p.name}</h2><p>${p.sub}${straight > .3 ? ` · ${straight.toFixed(1)} km from ${o.name}` : ''}</p></div><button class="x" id="close" aria-label="Close">${ICON.x}</button></div>`;
  if (straight < .4){ drawRoute(null); body.innerHTML = head + `<p class="empty">This is your start point. Pick somewhere else on the map, or search above.</p>`; bindCard(); return; }
  const dep = departFor(S.mode, o, p), q = trip(S.mode, o, p, dep), arr = dep + q.mid;
  drawRoute(q);
  const best = bestDeparture(S.mode, o, p, dep);
  const lo = dep+q.lo, hi = dep+q.hi, c0 = arr-24, pct = v => Math.max(0,Math.min(100,(v-c0)/48*100));
  const modes = MODES.map(m => { const d = departFor(m.id, o, p), r = trip(m.id, o, p, d);
    return `<button class="mode" data-mode="${m.id}" aria-pressed="${m.id===S.mode}" aria-label="${m.name}, ${Math.round(r.mid)} minutes">${ICON[m.icon]}<b>${Math.round(r.mid)} min</b><small>${S.type==='leave' ? fmt(d+r.mid) : 'leave '+fmt(d)}</small></button>`; }).join('');

    ? `<div class="tip"><div><b>Leave at ${fmt(best.t)} to save ${Math.round(q.mid-best.d)} min</b>Traffic builds on your route after ${fmt(best.t+15)}.</div><button class="use" data-t="${best.t}">Use</button></div>`

    <div class="answer">

      <div class="side"><b>${Math.round(q.mid)} min · ${q.km.toFixed(1)} km</b>${S.type==='leave' ? 'leaving '+fmt(dep) : 'to arrive by '+fmt(S.arrive)}</div>
    </div>
    <div><div class="wtrack"><span class="wband" style="left:${pct(lo)}%;width:${pct(hi)-pct(lo)}%"></span><span class="wmid" style="left:${pct(arr)}%"></span>${S.type==='arrive' ? `<span class="wgoal" style="left:${pct(S.arrive)}%"></span>` : ''}</div>
      <div class="wticks"><span>${fmt(lo)}</span><span>Likely window</span><span>${fmt(hi)}</span></div></div>
    <div class="modes" role="group" aria-label="Way to go">${modes}</div>
    ${preview}
    ${tip}
    <div class="rowset">
      <div class="rowx"><span class="k">From</span><span class="v">${o.name} · ${o.sub}</span><button class="link" id="chg-from">Change</button></div>
      <div class="rowx"><div class="seg" role="group" aria-label="Time type"><button data-type="leave" aria-pressed="${S.type==='leave'}">Leave</button><button data-type="arrive" aria-pressed="${S.type==='arrive'}">Arrive</button></div>
        <div class="timer"><output>${fmt(S.type==='leave'?S.t:S.arrive)}</output><input type="range" id="tr" min="330" max="660" step="5" value="${S.type==='leave'?S.t:S.arrive}" aria-label="Time"></div></div>
    </div>
    <div class="sigs">
      <div class="sig"><div class="k">${ICON.dist}Distance</div><div class="v">${q.km.toFixed(1)} km</div><div class="s">${Math.round(q.parts.dist)} min on clear roads</div></div>
      <div class="sig"><div class="k">${ICON.jam}Traffic<i class="model">model</i></div><div class="v">+${Math.round(q.parts.jam)} min</div><div class="s">${trafficLine}</div></div>
      <div class="sig"><div class="k">${ICON.rain}Weather<i class="real">real</i></div><div class="v">${Math.round(q.r*100)}% rain</div><div class="s">Today's forecast. Adds ${Math.max(0,Math.round(q.parts.rain))} min on average</div></div>
      <div class="sig"><div class="k">${ICON.hist}20 years<i class="real">real</i></div><div class="v">${(histRain(dep)*100).toFixed(0)}% of days</div><div class="s">November weekday mornings with rain near ${fmt(dep)}, 2006–2025</div></div>
    </div>
    <button class="primary ${hasRem?'done':''}" id="remind" data-at="${remindAt}">${ICON.bell}${hasRem ? `Reminder set for ${fmt(remindAt)}` : `Remind me at ${fmt(remindAt)}`}</button>
    <div class="acts">
      <button class="act" id="a-go">${ICON.go}${S.preview ? 'Stop' : 'Start'}</button>
      <button class="act" id="a-save" aria-pressed="${isSaved}">${ICON.star}${isSaved ? 'Saved' : 'Save'}</button>
      <button class="act" id="a-share">${ICON.share}Share</button>
      <button class="act" id="a-from">${ICON.flag}Start here</button>
    </div>
    <div id="sharebox"></div>
    <p class="note">The map is an illustration of central Bangkok and routes follow its main roads. Traffic is a sample model. Weather is today's Open-Meteo forecast and its 2006–2025 record.</p>`;
  bindCard();
}
function bindCard(){
  const B = $('cbody');
  $('close').onclick = closeCard;
  B.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { S.mode = b.dataset.mode; stopPreview(); renderAll(); fitRoute(); });
  B.querySelectorAll('[data-type]').forEach(b => b.onclick = () => { S.type = b.dataset.type; renderAll(); });
  const u = B.querySelector('.use'); if (u) u.onclick = () => { S.t = +u.dataset.t; S.type='leave'; renderAll(); toast(`Leaving at ${fmt(S.t)}`); };
  const tr = $('tr'); if (tr) tr.oninput = e => { const v = +e.target.value; S.type==='leave' ? S.t = v : S.arrive = v; renderAll(true); };
  const cf = $('chg-from'); if (cf) cf.onclick = () => { const opts = [...PLACES.filter(p=>p.saved), ...SAVED]; const i = opts.findIndex(p => p.id === S.from.id); S.from = {...opts[(i+1) % opts.length]}; stopPreview(); renderAll(); fitRoute(); toast(`Starting from ${S.from.name}`); };
  const rm = $('remind'); if (rm) rm.onclick = () => {
    const at = +rm.dataset.at, idx = REMINDERS.findIndex(r => r.id === S.sel.id && r.at === at);
    if (idx >= 0) REMINDERS.splice(idx, 1); else REMINDERS = [{id:S.sel.id, name:S.sel.name, at}];
    store.set('reminders', REMINDERS); renderReminders(); renderCard(); toast(idx >= 0 ? 'Reminder removed' : `Reminder set for ${fmt(at)}`);
  };
  const go = $('a-go'); if (go) go.onclick = () => { if (S.preview){ stopPreview(); renderAll(); } else startPreview(); };
  const sv = $('a-save'); if (sv) sv.onclick = () => {
    const p = S.sel; if (p.saved) return toast(`${p.name} is already one of your places`);
    const i = SAVED.findIndex(s => s.id === p.id);
    if (i >= 0){ SAVED.splice(i,1); toast('Removed from your places'); } else { SAVED.push({id:p.id, name:p.name, sub:p.sub, x:p.x, y:p.y}); toast('Saved to your places'); }
    store.set('saved', SAVED); renderAll();
  };
  const sh = $('a-share'); if (sh) sh.onclick = () => {
    const o = S.from, p = S.sel, dep = departFor(S.mode, o, p), q = trip(S.mode, o, p, dep);
    const text = `${o.name} → ${p.name} by ${MODES.find(m=>m.id===S.mode).name.toLowerCase()}: leave ${fmt(dep)}, arrive about ${fmt(dep+q.mid)} (${Math.round(q.mid)} min). Planned with Fast Arrival.`;
    const fallback = () => { $('sharebox').innerHTML = `<input class="copybox" id="copybox" readonly aria-label="Trip summary to copy">`; const c = $('copybox'); c.value = text; c.focus(); c.select(); toast('Copy the text below'); };
    try { navigator.clipboard.writeText(text).then(() => toast('Trip copied. Paste it anywhere.'), fallback); } catch(e){ fallback(); }
  };
  const af = $('a-from'); if (af) af.onclick = () => { S.from = {...S.sel}; toast(`Starting from ${S.sel.name}. Now pick where to go.`); closeCard(); };
}

/* ===== Start: trip preview ===== */
let raf = 0;
function startPreview(){
  const o = S.from, p = S.sel, dep = departFor(S.mode, o, p), q = trip(S.mode, o, p, dep), geo = S.sel.geo; if (!geo) return;
  const dur = q.mid*60*1000/120, t0 = performance.now();
  S.preview = {x:geo[0][0], y:geo[0][1]}; renderAll();
  const step = now => {
    const f = Math.min(1, (now - t0)/dur), pt = pointAlong(geo, f); S.preview.x = pt.x; S.preview.y = pt.y;
    const m = $('mover'); if (m){ m.dataset.x = pt.x; m.dataset.y = pt.y; const s = toScreen(pt.x, pt.y); m.style.left = s.x+'px'; m.style.top = s.y+'px'; }
    const l = $('pv-left'); if (l) l.textContent = `${Math.max(0, Math.ceil(q.mid*(1-f)))} min`;
    const b = $('pv-bar'); if (b) b.style.width = (f*100)+'%';
    if (f < 1) raf = requestAnimationFrame(step); else { toast(`Arrived at ${p.name}`); setTimeout(() => { stopPreview(); renderAll(); }, 900); }
  };
  cancelAnimationFrame(raf); raf = requestAnimationFrame(step);
}
function stopPreview(){ cancelAnimationFrame(raf); S.preview = null; }

function renderReminders(){
  const s = $('rstrip'), r = REMINDERS[0];
  if (!r){ s.hidden = true; return; }
  s.hidden = false;
  s.innerHTML = `${ICON.bell}<span>Leave for ${r.name} at <b>${fmt(r.at)}</b>. The phone app sends the alert.</span><button id="rm-x" aria-label="Remove reminder">${ICON.x}</button>`;
  $('rm-x').onclick = () => { REMINDERS = []; store.set('reminders', REMINDERS); renderReminders(); if (S.sel) renderCard(); };
}
let toastT = 0;
function toast(msg){ const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2400); }
function renderAll(keepFocus){ const active = keepFocus ? document.activeElement?.id : null; renderCard(); renderMarkers(); renderLayers(); if (active && $(active)) $(active).focus(); }

/* ===== Search ===== */
const q = $('q'), sugg = $('sugg');
let actIdx = 0, lastList = [];
function showSugg(){
  const s = q.value.trim().toLowerCase(); $('qclear').hidden = !s;
  const places = allPlaces().filter(p => !s || (p.name+' '+p.sub).toLowerCase().includes(s));
  const roads = s ? ROAD_INFO.map((r,i)=>({...r,i})).filter(r => r.n.toLowerCase().includes(s)).slice(0,4) : [];
  const mine = places.filter(p => p.saved || p.savedPin), other = places.filter(p => !p.saved && !p.savedPin).slice(0, s ? 12 : 8);
  lastList = [...mine, ...other, ...roads.map(r => ({road:r}))]; actIdx = 0;
  if (!lastList.length){ sugg.innerHTML = `<h4>No place called "${q.value}" on this map. Tap the map to drop a pin instead.</h4>`; sugg.hidden = false; return; }
  let i = 0;
  const item = p => `<button data-i="${i}" class="${i++===0?'act':''}"><span class="si">${ICON[p.icon || (p.savedPin ? 'star' : 'pin')]}</span><span><b>${p.name}</b><span class="s">${p.sub}</span></span></button>`;
  const rItem = r => `<button data-i="${i}" class="${i++===0?'act':''}"><span class="si">${ICON.road}</span><span><b>${r.n}</b><span class="s">Road</span></span></button>`;
  let h = '';
  if (mine.length) h += '<h4>Your places</h4>' + mine.map(item).join('');
  if (other.length) h += `<h4>${s ? 'Places' : 'Popular in Bangkok'}</h4>` + other.map(item).join('');
  if (roads.length) h += '<h4>Roads</h4>' + roads.map(rItem).join('');
  sugg.innerHTML = h; sugg.hidden = false;
}
q.addEventListener('focus', showSugg);
q.addEventListener('input', showSugg);
q.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ sugg.hidden = true; q.blur(); return; }
  if (!lastList.length) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){ e.preventDefault(); actIdx = (actIdx + (e.key==='ArrowDown'?1:-1) + lastList.length) % lastList.length; sugg.querySelectorAll('button').forEach((b,i)=>b.classList.toggle('act', i===actIdx)); }
  if (e.key === 'Enter') pick(lastList[actIdx]);
});
sugg.addEventListener('mousedown', e => { const b = e.target.closest('button[data-i]'); if (b){ e.preventDefault(); pick(lastList[+b.dataset.i]); } });
sugg.addEventListener('click', e => { const b = e.target.closest('button[data-i]'); if (b && !sugg.hidden) pick(lastList[+b.dataset.i]); });
$('qclear').onclick = () => { q.value = ''; $('qclear').hidden = true; q.focus(); showSugg(); };
function pick(item){
  sugg.hidden = true; q.blur();
  if (item.road){ const p = ROADS[item.road.i][1], m = p[Math.floor(p.length/2)]; q.value = item.road.n; $('qclear').hidden = false; return select({id:'road-'+item.road.i, name:item.road.n, sub:nearestDistrict(m[0],m[1]), x:m[0], y:m[1]}); }
  q.value = item.name; $('qclear').hidden = false; select({...item});
}
document.addEventListener('pointerdown', e => { if (!e.target.closest('.search')) sugg.hidden = true; });

/* ===== Gestures: drag, pinch, wheel, tap ===== */
const ptrs = new Map(); let drag = null, pinch = null;
svg.addEventListener('pointerdown', e => {
  svg.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (ptrs.size === 1) drag = {x:e.clientX, y:e.clientY, tx:S.view.tx, ty:S.view.ty, moved:false};
  if (ptrs.size === 2){ const [a,b] = [...ptrs.values()]; pinch = {d:Math.hypot(a.x-b.x, a.y-b.y) || 1, k:S.view.k, w:toWorld((a.x+b.x)/2, (a.y+b.y)/2)}; if (drag) drag.moved = true; }
});
svg.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) return; ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (pinch && ptrs.size >= 2){ const [a,b] = [...ptrs.values()], d = Math.hypot(a.x-b.x, a.y-b.y), mx = (a.x+b.x)/2, my = (a.y+b.y)/2;
    const k = Math.max(.35, Math.min(4.5, pinch.k*d/pinch.d)); S.view.k = k; S.view.tx = mx - pinch.w.x*k; S.view.ty = my - pinch.w.y*k; applyView(); return; }
  if (!drag) return; const dx = e.clientX-drag.x, dy = e.clientY-drag.y;
  if (!drag.moved && Math.hypot(dx,dy) > 6){ drag.moved = true; svg.classList.add('dragging'); }
  if (drag.moved){ S.view.tx = drag.tx+dx; S.view.ty = drag.ty+dy; applyView(); }
});
const endPtr = e => {
  const wasTap = drag && !drag.moved && ptrs.size === 1;
  ptrs.delete(e.pointerId);
  if (ptrs.size < 2) pinch = null;
  if (ptrs.size === 1){ const [p] = [...ptrs.values()]; drag = {x:p.x, y:p.y, tx:S.view.tx, ty:S.view.ty, moved:true}; }
  if (ptrs.size === 0){ if (wasTap && e.type === 'pointerup'){ const w = toWorld(e.clientX, e.clientY); q.value=''; $('qclear').hidden = true; selectAt(w.x, w.y); } drag = null; svg.classList.remove('dragging'); }
};
svg.addEventListener('pointerup', endPtr); svg.addEventListener('pointercancel', endPtr);
svg.addEventListener('wheel', e => { e.preventDefault(); zoomAt(Math.exp(-e.deltaY*.0015), e.clientX, e.clientY); }, {passive:false});
markers.addEventListener('click', e => { const b = e.target.closest('[data-place]'); if (b){ q.value=''; select({...allPlaces().find(p=>p.id===b.dataset.place)}); } else if (e.target.closest('#me')) toast(`You start from ${S.from.name}. Use Start here on any place to change it.`); });
$('zin').onclick = () => zoomAt(1.4, innerWidth/2, innerHeight/2);
$('zout').onclick = () => zoomAt(1/1.4, innerWidth/2, innerHeight/2);
$('compass').onclick = fitAll;
$('locate').onclick = () => { const o = S.from; fitBounds([o.x-120, o.x+120], [o.y-120, o.y+120], 2.2); };
$('layer').onclick = () => { S.sat = !S.sat; renderLayers(); };
$('l-traffic').onclick = () => { S.traffic = !S.traffic; renderLayers(); };
$('l-rain').onclick = () => { S.rain = !S.rain; renderLayers(); if (S.rain) toast(`${Math.round(rainChance(S.t)*100)}% chance of rain at ${fmt(S.t)} (Open-Meteo forecast)`); };
$('l-rail').onclick = () => { S.rail = !S.rail; renderLayers(); };
$('handle').onclick = () => { S.sheetFull = !S.sheetFull; $('card').classList.toggle('peek', !S.sheetFull); $('handle').setAttribute('aria-label', S.sheetFull ? 'Show less' : 'Show more'); setTimeout(fitRoute, 320); };
addEventListener('resize', placeOverlays);

fitAll(); renderAll(); renderReminders();
window.__fa = {trip, PLACES, S, cal:() => cal};
})();
</script>
