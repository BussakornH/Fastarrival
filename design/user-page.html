<title>Fast Arrival</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap">
<style>
/* Layout: full-screen map. Floating search + layer chips top-left (Google), control stack top-right (Apple),
   Map/Satellite layer tile bottom-left (Google), zoom bottom-right (Apple). Picking a place opens the
   arrival card: a left floating panel on desktop (Apple place card), a bottom sheet on phones. */
:root{
  --chrome:#FFFFFF; --chrome-2:#F5F5F7; --ink:#1D1D1F; --muted:#6E6E73; --rule:#E3E3E8;
  --blue:#0071E3; --blue-hover:#0077ED; --on-blue:#FFFFFF; --blue-soft:#E8F1FD;
  --good:#1E8E3E; --warn:#E37400; --bad:#D93025; --good-soft:#E6F4EA; --warn-soft:#FEF3E2;
  --shadow:0 2px 10px rgba(0,0,0,.14), 0 0 0 .5px rgba(0,0,0,.06);
  --m-land:#F2EFE9; --m-block:#E8E4DC; --m-water:#9CC8F0; --m-park:#C5E3BC; --m-road:#FFFFFF; --m-edge:#D9D4CB;
  --m-major:#FFE9A8; --m-major-edge:#E5C770; --m-label:#5F6368; --m-label-strong:#3C4043; --m-halo:rgba(255,255,255,.9); --m-rail:#7A5AF8;
  --font:"Inter","SF Pro Text",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --chrome:#1C1C1E; --chrome-2:#2C2C2E; --ink:#F5F5F7; --muted:#A1A1A6; --rule:#3A3A3C;
  --blue:#0A84FF; --blue-hover:#3395FF; --blue-soft:#0B2847;
  --good:#30D158; --warn:#FF9F0A; --bad:#FF453A; --good-soft:#0F2E1A; --warn-soft:#33240A;
  --shadow:0 2px 12px rgba(0,0,0,.5), 0 0 0 .5px rgba(255,255,255,.08);
  --m-land:#212326; --m-block:#26292D; --m-water:#1B3550; --m-park:#1E3324; --m-road:#3B3F45; --m-edge:#2A2D31;
  --m-major:#5B5243; --m-major-edge:#3E392F; --m-label:#9AA0A6; --m-label-strong:#C8CCD0; --m-halo:rgba(20,22,25,.85); --m-rail:#9D85FF; color-scheme:dark}}
:root[data-theme="dark"]{
  --chrome:#1C1C1E; --chrome-2:#2C2C2E; --ink:#F5F5F7; --muted:#A1A1A6; --rule:#3A3A3C;
  --blue:#0A84FF; --blue-hover:#3395FF; --blue-soft:#0B2847;
  --good:#30D158; --warn:#FF9F0A; --bad:#FF453A; --good-soft:#0F2E1A; --warn-soft:#33240A;
  --shadow:0 2px 12px rgba(0,0,0,.5), 0 0 0 .5px rgba(255,255,255,.08);
  --m-land:#212326; --m-block:#26292D; --m-water:#1B3550; --m-park:#1E3324; --m-road:#3B3F45; --m-edge:#2A2D31;
  --m-major:#5B5243; --m-major-edge:#3E392F; --m-label:#9AA0A6; --m-label-strong:#C8CCD0; --m-halo:rgba(20,22,25,.85); --m-rail:#9D85FF; color-scheme:dark}
/* Satellite look is the same in both themes */
#map.sat{--m-land:#3A4232; --m-block:#5A5C55; --m-water:#1D3940; --m-park:#26411F; --m-road:rgba(226,224,214,.55); --m-edge:transparent;
  --m-major:rgba(244,238,220,.8); --m-major-edge:transparent; --m-label:#FFFFFF; --m-label-strong:#FFFFFF; --m-halo:rgba(0,0,0,.65)}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--m-land);color:var(--ink);font:400 15px/1.4 var(--font);letter-spacing:-.01em;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit;letter-spacing:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* Map */
#map{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;background:var(--m-land);user-select:none}
#map.dragging{cursor:grabbing}
.land{fill:var(--m-land)} .block{fill:var(--m-block)} .water{fill:var(--m-water)} .park{fill:var(--m-park)}
.r-edge{fill:none;stroke:var(--m-edge);stroke-linecap:round;stroke-linejoin:round}
.r{fill:none;stroke:var(--m-road);stroke-linecap:round;stroke-linejoin:round}
.r-major-edge{fill:none;stroke:var(--m-major-edge);stroke-linecap:round;stroke-linejoin:round}
.r-major{fill:none;stroke:var(--m-major);stroke-linecap:round;stroke-linejoin:round}
.r-traffic{fill:none;stroke-linecap:round;stroke-linejoin:round;transition:stroke .3s;opacity:.8}
.rail{fill:none;stroke:var(--m-rail);stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.lbl{fill:var(--m-label);font:500 12px var(--font);paint-order:stroke;stroke:var(--m-halo);stroke-width:3px;stroke-linejoin:round;letter-spacing:.02em}
.lbl.dist{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.12em;opacity:.8}
.lbl.road{font-size:11px;font-weight:500}
.lbl.river{fill:#4A7FB5;font-style:italic;font-size:12px;stroke:none}
#map.sat .lbl.river{fill:#9CC8F0}
.satlayer{display:none} #map.sat .satlayer{display:inline}
.rain{fill:#2F80ED;transition:opacity .4s}
.route-casing{fill:none;stroke:#FFFFFF;stroke-linecap:round;stroke-linejoin:round}
.route{fill:none;stroke:var(--blue);stroke-linecap:round;stroke-linejoin:round}
#map.sat .route-casing{stroke:rgba(255,255,255,.9)}

/* Map markers (HTML overlay) */
#markers{position:fixed;inset:0;pointer-events:none}
.mk{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;display:flex;flex-direction:column;align-items:center;border:0;background:none;padding:0}
.mk .dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--chrome);color:var(--ink);box-shadow:var(--shadow);border:2px solid var(--chrome)}
.mk .dot svg{width:16px;height:16px}
.mk.home .dot{width:22px;height:22px;background:var(--blue);border:3px solid #fff;color:transparent;position:relative;margin-bottom:4px}
.mk.home .dot svg{display:none}
.mk.home .dot::after{content:"";position:absolute;inset:-12px;border-radius:50%;background:var(--blue);opacity:.18;animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{transform:scale(.5);opacity:.35}100%{transform:scale(1.4);opacity:0}}
.mk .name{margin-top:3px;font-size:12px;font-weight:600;color:var(--m-label-strong);text-shadow:0 0 3px var(--m-halo),0 0 3px var(--m-halo),0 0 3px var(--m-halo);white-space:nowrap}
#map.sat ~ #markers .mk .name{color:#fff;text-shadow:0 0 3px #000,0 0 3px #000}
.mk .eta{position:absolute;bottom:calc(100% + 2px);left:50%;transform:translateX(-50%);background:var(--chrome);color:var(--ink);font-size:12px;font-weight:600;padding:3px 8px;border-radius:99px;box-shadow:var(--shadow);white-space:nowrap;font-variant-numeric:tabular-nums}
.mk .eta b{color:var(--blue);font-weight:600}
.pin{position:absolute;transform:translate(-50%,-100%);pointer-events:none;display:flex;flex-direction:column;align-items:center}
.pin svg{width:34px;height:44px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
.pin.drop{animation:drop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes drop{from{transform:translate(-50%,-160%)}to{transform:translate(-50%,-100%)}}
.bubble{position:absolute;transform:translate(-50%,-50%);pointer-events:none;background:var(--blue);color:#fff;font-size:13px;font-weight:600;padding:5px 10px;border-radius:10px;box-shadow:var(--shadow);white-space:nowrap;font-variant-numeric:tabular-nums}
.bubble small{font-weight:500;opacity:.85;margin-left:4px}

/* Top-left: search + chips */
.top{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;gap:10px;align-items:flex-start;pointer-events:none;z-index:5}
.search{pointer-events:auto;width:380px;max-width:100%;position:relative;flex:none}
.sbox{display:flex;align-items:center;gap:8px;background:var(--chrome);border-radius:24px;box-shadow:var(--shadow);height:48px;padding:0 6px 0 16px}
.sbox svg{width:18px;height:18px;color:var(--muted);flex:none}
.sbox input{flex:1;min-width:0;border:0;background:transparent;font-size:16px;height:100%}
.sbox input:focus{outline:none}
.brand{display:flex;align-items:center;gap:6px;font-weight:600;font-size:13px;color:var(--blue);white-space:nowrap;padding:0 10px;border-left:1px solid var(--rule);height:28px}
.brand svg{color:var(--blue);width:14px;height:14px}
.sugg{position:absolute;top:56px;left:0;right:0;background:var(--chrome);border-radius:16px;box-shadow:var(--shadow);padding:6px;max-height:min(60vh,420px);overflow:auto}
.sugg h4{margin:8px 10px 4px;font-size:12px;font-weight:600;color:var(--muted)}
.sugg button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:10px;cursor:pointer}
.sugg button:hover,.sugg button.act{background:var(--chrome-2)}
.sugg .si{width:30px;height:30px;border-radius:50%;background:var(--chrome-2);display:grid;place-items:center;flex:none}
.sugg .si svg{width:15px;height:15px}
.sugg b{display:block;font-weight:500;font-size:15px}
.sugg span.s{display:block;font-size:12px;color:var(--muted)}
.chips{display:flex;gap:8px;pointer-events:auto;overflow-x:auto;scrollbar-width:none;padding:4px 2px 8px;min-width:0}
.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:18px;border:0;background:var(--chrome);box-shadow:var(--shadow);font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap}
.chip svg{width:16px;height:16px}
.chip[aria-pressed="true"]{background:var(--blue-soft);color:var(--blue)}
@media (max-width:720px){.top{flex-direction:column;gap:6px}.search{width:100%}.chips{width:100%}}

/* Right controls */
.ctrl{position:fixed;right:max(12px,env(safe-area-inset-right,0px));z-index:4;display:flex;flex-direction:column;background:var(--chrome);border-radius:10px;box-shadow:var(--shadow);overflow:hidden}
.ctrl button{width:40px;height:40px;border:0;background:none;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.ctrl button+button{border-top:1px solid var(--rule)}
.ctrl button:hover{background:var(--chrome-2)}
.ctrl svg{width:18px;height:18px}
#ctrl-top{top:calc(12px + env(safe-area-inset-top,0px))}
#ctrl-zoom{bottom:calc(28px + env(safe-area-inset-bottom,0px))}
@media (max-width:720px){#ctrl-top{top:calc(112px + env(safe-area-inset-top,0px))}#ctrl-zoom{display:none}}
#compass svg{transition:transform .3s}

/* Layer tile */
.layer{position:fixed;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(28px + env(safe-area-inset-bottom,0px));z-index:4;width:72px;height:72px;border-radius:12px;border:2px solid #fff;box-shadow:var(--shadow);cursor:pointer;padding:0;overflow:hidden;display:flex;align-items:flex-end;background-size:cover}
.layer span{width:100%;font-size:12px;font-weight:600;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.6));padding:14px 6px 5px;text-align:left;display:flex;gap:4px;align-items:center}
.layer span svg{width:13px;height:13px}
.layer.to-sat{background:radial-gradient(circle at 30% 30%,#56603F 0 18%,transparent 19%),radial-gradient(circle at 70% 65%,#2F4A2A 0 22%,transparent 23%),linear-gradient(135deg,#4A5340,#66695C 45%,#3D4A35)}
.layer.to-map{background:linear-gradient(90deg,transparent 46%,#FFE9A8 46% 54%,transparent 54%),linear-gradient(0deg,transparent 40%,#fff 40% 46%,transparent 46%),radial-gradient(circle at 75% 25%,#C5E3BC 0 20%,transparent 21%),linear-gradient(160deg,#F2EFE9,#E8E4DC)}
.layer.to-map span{color:#1D1D1F;background:linear-gradient(transparent,rgba(255,255,255,.85))}

/* Hint toast */
.hint{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:4;background:var(--chrome);box-shadow:var(--shadow);border-radius:14px;padding:10px 16px;font-size:14px;display:flex;gap:10px;align-items:center;max-width:calc(100% - 200px)}
.hint svg{width:18px;height:18px;color:var(--blue);flex:none}
@media (max-width:720px){.hint{max-width:calc(100% - 120px);left:auto;right:12px;transform:none;font-size:13px}}

/* Arrival card */
.card{position:fixed;z-index:6;background:var(--chrome);box-shadow:0 8px 30px rgba(0,0,0,.18),0 0 0 .5px rgba(0,0,0,.06);display:flex;flex-direction:column;overflow:hidden}
@media (min-width:721px){.card{left:max(12px,env(safe-area-inset-left,0px));top:calc(72px + env(safe-area-inset-top,0px));width:380px;max-height:calc(100% - 96px - env(safe-area-inset-top,0px));border-radius:18px}
  .card.open ~ .layer{left:404px} .handle{display:none}}
@media (max-width:720px){.card{left:0;right:0;bottom:0;border-radius:18px 18px 0 0;max-height:min(82%,680px);padding-bottom:env(safe-area-inset-bottom,0px);transition:max-height .3s ease}
  .card.peek{max-height:252px}}
.handle{width:100%;height:20px;border:0;background:none;display:grid;place-items:center;cursor:pointer;flex:none}
@media (min-width:721px){.handle{display:none!important}}
.handle::before{content:"";width:38px;height:5px;border-radius:3px;background:var(--rule)}
.cscroll{overflow-y:auto;padding:16px 18px 18px;display:flex;flex-direction:column;gap:16px}
.cscroll>*{flex-shrink:0}
@media (max-width:720px){.cscroll{padding-top:4px}}
.chead{display:flex;gap:10px;align-items:flex-start}
.chead h2{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0;line-height:1.15}
.chead p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.chead>div{flex:1;min-width:0}
.x{width:30px;height:30px;border-radius:50%;border:0;background:var(--chrome-2);display:grid;place-items:center;cursor:pointer;flex:none;color:var(--muted)}
.x svg{width:14px;height:14px}
.answer{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.answer .lab{font-size:13px;font-weight:600;color:var(--muted)}
.answer .big{font-size:56px;font-weight:700;letter-spacing:-.035em;line-height:.95;font-variant-numeric:tabular-nums}
.answer .side{text-align:right;font-size:13px;color:var(--muted);padding-bottom:4px}
.answer .side b{display:block;color:var(--ink);font-size:15px;font-weight:600}
.wtrack{position:relative;height:6px;background:var(--chrome-2);border-radius:3px;margin-top:-4px}
.wband{position:absolute;top:0;bottom:0;background:var(--blue);opacity:.28;border-radius:3px}
.wmid{position:absolute;top:-4px;width:2px;height:14px;background:var(--blue);border-radius:1px}
.wgoal{position:absolute;top:-7px;height:20px;border-left:2px dashed var(--ink)}
.wticks{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mode{border:0;background:var(--chrome-2);border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.mode svg{width:20px;height:20px}
.mode b{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.mode small{font-size:11px;color:var(--muted)}
.mode[aria-pressed="true"]{background:var(--blue);color:var(--on-blue)}
.mode[aria-pressed="true"] small{color:var(--on-blue);opacity:.85}
.tip{display:flex;gap:10px;align-items:center;background:var(--warn-soft);border-radius:12px;padding:10px 10px 10px 12px;font-size:13px}
.tip.good{background:var(--good-soft)}
.tip>div{flex:1;min-width:0}
.tip b{display:block;font-size:14px}
.tip .use{border:0;background:var(--chrome);border-radius:99px;padding:6px 12px;font-weight:600;font-size:13px;color:var(--blue);cursor:pointer;flex:none}
.rowset{border-radius:12px;background:var(--chrome-2);overflow:hidden}
.rowx{display:flex;align-items:center;gap:10px;padding:10px 12px;font-size:14px}
.rowx+.rowx{border-top:1px solid var(--rule)}
.rowx .k{color:var(--muted);width:44px;flex:none;font-size:13px}
.rowx .v{flex:1;min-width:0;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowx .link{border:0;background:none;color:var(--blue);font-weight:500;cursor:pointer;padding:0;font-size:14px}
.seg{display:inline-grid;grid-template-columns:1fr 1fr;background:var(--rule);border-radius:8px;padding:2px}
.seg button{border:0;background:transparent;padding:4px 10px;border-radius:6px;cursor:pointer;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--chrome);box-shadow:0 1px 2px rgba(0,0,0,.15);font-weight:600}
.timer{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.timer output{font-weight:600;font-variant-numeric:tabular-nums;min-width:44px}
.timer input{flex:1;min-width:0;accent-color:var(--blue)}
.sigs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.sig{background:var(--chrome-2);border-radius:12px;padding:10px 12px;min-width:0}
.sig .k{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sig .k svg{width:14px;height:14px}
.sig .v{font-size:20px;font-weight:700;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.sig .s{font-size:12px;color:var(--muted);margin-top:1px}
.primary{border:0;background:var(--blue);color:var(--on-blue);border-radius:12px;height:48px;font-size:16px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.primary:hover{background:var(--blue-hover)}
.primary svg{width:18px;height:18px}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.act{border:0;background:var(--chrome-2);border-radius:12px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:500;color:var(--blue);cursor:pointer}
.act svg{width:18px;height:18px}
.note{font-size:11px;color:var(--muted);line-height:1.4}
.empty{font-size:15px;color:var(--muted);padding:6px 0 4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<svg id="map" aria-label="Map of central Bangkok. Drag to move, tap to pick a place.">
  <defs>
    <filter id="satnoise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".045" numOctaves="4" seed="7"/>
      <feColorMatrix values="0 0 0 0 .28  0 0 0 0 .31  0 0 0 0 .24  0 0 0 .9 -.05"/>
    </filter>
    <pattern id="roofs" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(12)">
      <rect width="22" height="22" fill="#4E514A"/>
      <rect x="2" y="2" width="8" height="7" fill="#8A8A82"/><rect x="12" y="3" width="8" height="6" fill="#6E6F68"/>
      <rect x="3" y="12" width="6" height="8" fill="#7A7C74"/><rect x="11" y="12" width="9" height="8" fill="#9B9A90"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
  </defs>
  <g id="world"></g>
</svg>
<div id="markers"></div>

<div class="top">
  <div class="search">
    <div class="sbox">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input id="q" type="text" placeholder="Where to?" autocomplete="off" aria-label="Where to?" aria-controls="sugg">
      <span class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19 12 4l7 15"/><path d="M12 19v-4"/></svg>Fast Arrival</span>
    </div>
    <div class="sugg" id="sugg" hidden></div>
  </div>
  <div class="chips" role="group" aria-label="Map layers">
    <button class="chip" id="l-traffic" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="7" y="2" width="10" height="20" rx="3"/><circle cx="12" cy="7" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="17" r="1.4"/></svg>Traffic</button>
    <button class="chip" id="l-rain" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 15a4 4 0 1 1 1-7.9A5 5 0 0 1 18 9a3 3 0 0 1 0 6Z"/><path d="M9 18l-1 2M13 18l-1 2M17 18l-1 2"/></svg>Rain radar</button>
    <button class="chip" id="l-rail" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="6" y="3" width="12" height="14" rx="3"/><path d="M6 11h12M9 21l1.5-4M15 21l-1.5-4"/></svg>Train lines</button>
  </div>
</div>

<div class="ctrl" id="ctrl-top">

  {id:'lump',  name:'Lumphini Park',       sub:'Rama IV Rd, Pathum Wan',   x:912, y:722},
  {id:'chat',  name:'Chatuchak Market',    sub:'Kamphaeng Phet, Chatuchak',x:860, y:160},

const pts = a => a.map(p=>p.join(',')).join(' ');
function drawMap(){
  el('rect',{x:-600,y:-600,width:W+1200,height:H+1200,class:'land'});
  el('rect',{x:-600,y:-600,width:W+1200,height:H+1200,filter:'url(#satnoise)',class:'satlayer',opacity:'.9'});
  // city blocks (map: soft blocks; satellite: roofs)
  const rnd = (s => () => (s = (s*16807) % 2147483647) / 2147483647)(42);
  const gBlocks = el('g',{});
  for (let i=0;i<520;i++){ const x = 380 + rnd()*1200, y = 80 + rnd()*950; if (Math.hypot(x-560,y-700) < 40) continue;
    el('rect',{x, y, width:14+rnd()*26, height:12+rnd()*22, rx:2, class:'block', opacity:(.45+rnd()*.5).toFixed(2)}, gBlocks); }
  el('path',{d:'M420 60 L1640 60 L1640 1100 L620 1100 C600 980 520 860 440 720 C380 620 360 400 420 60Z', fill:'url(#roofs)', class:'satlayer', opacity:'.55'});

  for (let i=0;i<70;i++){ const x = 360 + rnd()*1240, y = 40 + rnd()*1000, l = 60 + rnd()*140, a = rnd() < .5 ? 0 : Math.PI/2 + (rnd()-.5)*.3;
    el('line',{x1:x,y1:y,x2:x+Math.cos(a)*l,y2:y+Math.sin(a)*l,class:'r','stroke-width':3,opacity:.9}, gMinor); }

drawMap();

/* ---------- Prediction model (sample data) ---------- */
const MODES = [
  {id:'car', name:'Car', icon:'car'}, {id:'rail', name:'Train', icon:'rail'}, {id:'moto', name:'Motorbike', icon:'moto'}, {id:'bus', name:'Bus', icon:'bus'}];
const jamAt  = t => Math.min(1, .15 + .85*Math.exp(-(((t-490)/55)**2)));
const rainAt = t => .2 + .45*Math.exp(-(((t-460)/70)**2));
const fmt = m => { m = Math.round(m); return String(Math.floor(((m%1440)+1440)%1440/60)).padStart(2,'0')+':'+String(((m%60)+60)%60).padStart(2,'0'); };
const kmBetween = (a,b) => Math.hypot(a.x-b.x, a.y-b.y) * .021;
function params(id, km){
  switch(id){
    case 'car':  return {base:km/32*60+2, jam:km*2.3, rain:km*.7, hist:3, spread:.2};
    case 'rail': return {base:km/34*60+10, jam:1.5, rain:3.5, hist:2, spread:.07};
    case 'moto': return {base:km/38*60+2, jam:km*.8, rain:km*1.15, hist:1, spread:.16};
    case 'bus':  return {base:km/21*60+6, jam:km*2, rain:6, hist:4, spread:.24};
  }
}
function predict(id, km, t){
  const m = params(id, km), j = jamAt(t), r = rainAt(t);
  const parts = {dist:m.base, jam:m.jam*j, rain:m.rain*r, hist:m.hist*(.5+.5*j)};
  const mid = parts.dist+parts.jam+parts.rain+parts.hist;
  return {parts, mid, lo:mid*(1-m.spread*.8), hi:mid*(1+m.spread*1.1), j, r, spread:m.spread};
}
const ICON = {
  car:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 16V11l2-5h10l2 5v5"/><path d="M3 16h18"/><circle cx="7.5" cy="17.5" r="1.5"/><circle cx="16.5" cy="17.5" r="1.5"/></svg>',
  rail:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="3" width="12" height="14" rx="3"/><path d="M6 11h12M9 21l1.5-4M15 21l-1.5-4"/></svg>',
  bus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="15" rx="2"/><path d="M4 11h16M8 21v-3M16 21v-3"/></svg>',
  moto:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.5" cy="16.5" r="3"/><circle cx="18.5" cy="16.5" r="3"/><path d="M5.5 16.5 10 10h5l3.5 6.5M13 6h3l-1 4"/></svg>',
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M3 11 12 4l9 7v9H3Z"/></svg>',
  work:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5h6v2"/></svg>',
  gym:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>',
  pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12Z"/><circle cx="12" cy="9" r="2.5"/></svg>',
  dist:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20 20 4"/><circle cx="5" cy="19" r="2"/><circle cx="19" cy="5" r="2"/></svg>',
  jam:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="7" y="2" width="10" height="20" rx="3"/><circle cx="12" cy="7" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="17" r="1.4"/></svg>',
  rain:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 15a4 4 0 1 1 1-7.9A5 5 0 0 1 18 9a3 3 0 0 1 0 6Z"/><path d="M9 18l-1 2M13 18l-1 2M17 18l-1 2"/></svg>',
  hist:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg>',
  bell:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M6 16V11a6 6 0 1 1 12 0v5l2 2H4Z"/><path d="M10 21h4"/></svg>',
  star:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m12 3 2.8 5.8 6.2.9-4.5 4.4 1 6.2L12 17.4 6.5 20.3l1-6.2L3 9.7l6.2-.9z"/></svg>',
  share:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M5 12v7h14v-7"/></svg>',
  go:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 3 3 10.5l7.5 2.4L13 21z"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
};

/* ---------- State ---------- */
const S = {view:{k:1,tx:0,ty:0}, sat:false, traffic:true, rain:false, rail:true, sel:null, from:'home', mode:'car', type:'leave', t:470, arrive:540, sheetFull:false};
const origin = () => PLACES.find(p=>p.id===S.from);

/* ---------- View transform ---------- */
const isPhone = () => innerWidth <= 720;
function applyView(){ const {k,tx,ty} = S.view; world.setAttribute('transform', `translate(${tx} ${ty}) scale(${k})`); placeOverlays(); }
function fitView(){
  const w = innerWidth, h = innerHeight, k = Math.max(.42, Math.min(w/1050, h/860));
  const cx = 840, cy = 560, offX = (!isPhone() && S.sel) ? 200 : 0, offY = isPhone() ? -40 : 30;
  S.view = {k, tx: w/2 + offX - cx*k, ty: h/2 + offY - cy*k}; applyView();
}
const toWorld = (sx,sy) => ({x:(sx - S.view.tx)/S.view.k, y:(sy - S.view.ty)/S.view.k});
const toScreen = (x,y) => ({x: x*S.view.k + S.view.tx, y: y*S.view.k + S.view.ty});
function zoomAt(f, sx, sy){ const k2 = Math.max(.35, Math.min(4, S.view.k*f)); const w = toWorld(sx,sy); S.view.k = k2; S.view.tx = sx - w.x*k2; S.view.ty = sy - w.y*k2; applyView(); }

/* ---------- Overlays: markers, pin, time bubble ---------- */
const markers = $('markers');
function placeOverlays(){
  markers.querySelectorAll('[data-x]').forEach(n => { const p = toScreen(+n.dataset.x, +n.dataset.y); n.style.left = p.x+'px'; n.style.top = p.y+'px'; });
}
function renderMarkers(){
  const o = origin(), dep = S.t;
  let h = '';
  for (const p of PLACES.filter(p=>p.saved)){
    let eta = '';
    if (!S.sel && p.id !== S.from){ const q = predict('car', kmBetween(o,p), dep); eta = `<span class="eta">${p.name} <b>${fmt(dep+q.mid)}</b></span>`; }
    h += `<button class="mk ${p.id===S.from?'home':''}" data-x="${p.x}" data-y="${p.y}" data-place="${p.id}" aria-label="${p.name}, ${p.sub}">${eta}<span class="dot">${ICON[p.icon]}</span><span class="name">${p.id===S.from ? 'You · '+p.name : p.name}</span></button>`;
  }
  if (S.sel){
    h += `<div class="pin drop" data-x="${S.sel.x}" data-y="${S.sel.y}"><svg viewBox="0 0 34 44"><path d="M17 43C17 43 32 27.5 32 16A15 15 0 0 0 2 16C2 27.5 17 43 17 43Z" fill="#E53935" stroke="#fff" stroke-width="2"/><circle cx="17" cy="16" r="5.5" fill="#fff"/></svg></div>`;
    if (S.sel.mid) h += `<div class="bubble" data-x="${S.sel.mid.x}" data-y="${S.sel.mid.y}">${S.sel.bubble}</div>`;
  }
  markers.innerHTML = h; placeOverlays();
}

/* ---------- Layers ---------- */
function renderLayers(){
  svg.classList.toggle('sat', S.sat);
  const L = $('layer'); L.className = 'layer ' + (S.sat ? 'to-map' : 'to-sat'); $('layer-l').textContent = S.sat ? 'Map' : 'Satellite';
  L.setAttribute('aria-label', S.sat ? 'Switch to map view' : 'Switch to satellite view');
  $('traffic').style.display = S.traffic ? '' : 'none';
  $('rails').style.display = S.rail ? '' : 'none';
  $('rain').setAttribute('opacity', S.rain ? (.25 + rainAt(S.t)*.55).toFixed(2) : 0);
  const j = jamAt(S.t);
  document.querySelectorAll('.r-traffic').forEach(n => { const v = j * +n.dataset.m; n.style.stroke = v > .62 ? 'var(--bad)' : v > .36 ? 'var(--warn)' : 'var(--good)'; });
  for (const [id,on] of [['l-traffic',S.traffic],['l-rain',S.rain],['l-rail',S.rail]]) $(id).setAttribute('aria-pressed', on);
}

/* ---------- Selecting a place ---------- */
function nearestDistrict(x,y){ let best = DISTRICTS[0], d = 1e9; for (const D of DISTRICTS){ const dd = Math.hypot(D[1]-x, D[2]-y); if (dd < d){ d = dd; best = D; } } return best[0]; }
function selectAt(x,y){
  let hit = null, hd = 26/S.view.k;
  for (const p of PLACES){ const d = Math.hypot(p.x-x, p.y-y); if (d < hd){ hd = d; hit = p; } }
  if (hit) return select({...hit});
  select({id:'pin', name:'Dropped pin', sub:`Near ${nearestDistrict(x,y)}`, x, y});
}
function select(p){
  S.sel = p;
  const card = $('card'); card.hidden = false; card.classList.add('open'); card.classList.toggle('peek', isPhone() && !S.sheetFull);
  if (p.id === S.from){ S.sel.mid = null; }
  renderAll();
  if (!isPhone()){ const s = toScreen(p.x,p.y); if (s.x < 440 || s.x > innerWidth-60 || s.y < 80 || s.y > innerHeight-60){ S.view.tx += (innerWidth/2+190) - s.x; S.view.ty += innerHeight/2 - s.y; applyView(); } }
  else { const s = toScreen(p.x,p.y); if (s.y > innerHeight-290 || s.y < 140){ S.view.ty += (innerHeight*.38) - s.y; S.view.tx += innerWidth/2 - s.x; applyView(); } }
}
function closeCard(){ S.sel = null; $('card').hidden = true; $('card').classList.remove('open'); $('routeg').innerHTML=''; renderAll(); }

function drawRoute(){
  const g = $('routeg'); g.innerHTML = '';
  if (!S.sel || S.sel.id === S.from) return;
  const a = origin(), b = S.sel, mx = (a.x+b.x)/2, my = (a.y+b.y)/2;
  const dx = b.x-a.x, dy = b.y-a.y, len = Math.hypot(dx,dy) || 1, bend = Math.min(90, len*.18);
  const cx = mx - dy/len*bend, cy = my + dx/len*bend;
  const d = `M${a.x} ${a.y} Q${cx} ${cy} ${b.x} ${b.y}`;
  const dash = S.mode === 'rail' ? {'stroke-dasharray':'2 12'} : {};
  el('path',{d, class:'route-casing','stroke-width':13}, g);
  el('path',{d, class:'route','stroke-width':7, ...dash}, g);
  S.sel.mid = {x:.25*a.x + .5*cx + .25*b.x, y:.25*a.y + .5*cy + .25*b.y};
}

/* ---------- Card ---------- */
function departFor(km, id){
  if (S.type === 'leave') return S.t;
  for (let t = S.arrive - 5; t >= 300; t -= 5) if (t + predict(id,km,t).hi <= S.arrive) return t;
  return 300;
}
function bestDeparture(km, id, around){
  let best = {t:around, d:predict(id,km,around).mid};
  for (let t = around-45; t <= around+15; t += 5){ if (t < 360 || t > 600) continue; const d = predict(id,km,t).mid; if (d < best.d - .5) best = {t,d}; }
  return best;
}
function renderCard(){
  if (!S.sel) return;
  const p = S.sel, o = origin(), km = kmBetween(o,p), body = $('cbody');
  const head = `<div class="chead"><div><h2>${p.name}</h2><p>${p.sub}${p.id!==S.from ? ` · ${km.toFixed(1)} km from ${o.name}` : ''}</p></div><button class="x" id="close" aria-label="Close">${ICON.x}</button></div>`;
  if (p.id === S.from || km < .4){
    body.innerHTML = head + `<p class="empty">You're starting here. Pick another place, or change where you start from.</p>` + fromRow(o);
    bindCard(); return;
  }
  const dep = departFor(km, S.mode), q = predict(S.mode, km, dep), arr = dep + q.mid;
  const best = bestDeparture(km, S.mode, dep);
  const n = Math.max(120, Math.round(380 + km*60) - Math.abs(dep-470)*2);
  p.bubble = `${Math.round(q.mid)} min<small>${MODES.find(m=>m.id===S.mode).name.toLowerCase()}</small>`;
  const lo = dep+q.lo, hi = dep+q.hi, c0 = arr-24, pct = v => Math.max(0,Math.min(100,(v-c0)/48*100));
  const modes = MODES.map(m => { const d = departFor(km, m.id), r = predict(m.id, km, d);
    return `<button class="mode" data-mode="${m.id}" aria-pressed="${m.id===S.mode}">${ICON[m.icon]}<b>${Math.round(r.mid)} min</b><small>${S.type==='leave' ? fmt(d+r.mid) : 'by '+fmt(d)}</small></button>`; }).join('');
  let tip = '';
  if (S.type === 'leave' && dep - best.t >= 10 && q.mid - best.d >= 4)
    tip = `<div class="tip"><div><b>Leave at ${fmt(best.t)} to save ${Math.round(q.mid-best.d)} min</b>Traffic builds on your route after ${fmt(best.t+15)}.</div><button class="use" data-t="${best.t}">Use</button></div>`;
  else tip = `<div class="tip good"><div><b>Good time to go</b>${Math.round(92 - q.spread*60)} in 100 trips like this arrived on time.</div></div>`;
  const remind = (S.type==='leave' ? Math.min(dep, best.t) : dep) - 10;
  body.innerHTML = head + `
    <div class="answer">
      <div><div class="lab">${S.type==='leave' ? 'Arrive at' : 'Leave by'}</div><div class="big">${S.type==='leave' ? fmt(arr) : fmt(dep)}</div></div>
      <div class="side"><b>${Math.round(q.mid)} min</b>${S.type==='leave' ? 'leaving '+fmt(dep) : 'to arrive by '+fmt(S.arrive)}</div>
    </div>
    <div><div class="wtrack"><span class="wband" style="left:${pct(lo)}%;width:${pct(hi)-pct(lo)}%"></span><span class="wmid" style="left:${pct(arr)}%"></span>${S.type==='arrive' ? `<span class="wgoal" style="left:${pct(S.arrive)}%"></span>` : ''}</div>
      <div class="wticks"><span>${fmt(lo)}</span><span>80% likely window</span><span>${fmt(hi)}</span></div></div>
    <div class="modes" role="group" aria-label="Way to go">${modes}</div>
    ${tip}
    <div class="rowset">
      ${fromRow(o, true)}
      <div class="rowx"><span class="k">When</span><div class="seg" role="group" aria-label="Time type"><button data-type="leave" aria-pressed="${S.type==='leave'}">Leave</button><button data-type="arrive" aria-pressed="${S.type==='arrive'}">Arrive</button></div>
        <div class="timer"><output class="num">${fmt(S.type==='leave'?S.t:S.arrive)}</output><input type="range" id="tr" min="360" max="600" step="5" value="${S.type==='leave'?S.t:S.arrive}" aria-label="Time"></div></div>
    </div>
    <div class="sigs">
      <div class="sig"><div class="k">${ICON.dist}Distance</div><div class="v">${km.toFixed(1)} km</div><div class="s">Adds ${Math.round(q.parts.dist)} min of driving</div></div>
      <div class="sig"><div class="k">${ICON.jam}Traffic</div><div class="v">+${Math.round(q.parts.jam)} min</div><div class="s">${q.j>.7?'Heavy':q.j>.4?'Building':'Light'} at ${fmt(dep)}</div></div>
      <div class="sig"><div class="k">${ICON.rain}Weather</div><div class="v">${Math.round(q.r*100)}% rain</div><div class="s">Adds ${Math.round(q.parts.rain)} min</div></div>
      <div class="sig"><div class="k">${ICON.hist}20 years</div><div class="v">${n.toLocaleString('en-US')}</div><div class="s">similar trips since 2006</div></div>
    </div>
    <button class="primary" id="remind">${ICON.bell}Remind me at ${fmt(remind)}</button>
    <div class="acts"><button class="act" id="a-go">${ICON.go}Start</button><button class="act" id="a-save">${ICON.star}Save</button><button class="act" id="a-share">${ICON.share}Share</button></div>
    <p class="note">Design draft. The map is an illustration and every time on it comes from a sample model, not live traffic or weather.</p>`;
  bindCard();
}
function fromRow(o, inner){
  const r = `<div class="rowx"><span class="k">From</span><span class="v">${o.name} · ${o.sub}</span><button class="link" id="chg-from">Change</button></div>`;
  return inner ? r : `<div class="rowset">${r}</div>`;
}
function bindCard(){
  $('close').onclick = closeCard;
  $('cbody').querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { S.mode = b.dataset.mode; renderAll(); });
  $('cbody').querySelectorAll('[data-type]').forEach(b => b.onclick = () => { S.type = b.dataset.type; renderAll(); });
  const u = $('cbody').querySelector('.use'); if (u) u.onclick = () => { S.t = +u.dataset.t; S.type='leave'; renderAll(); };
  const tr = $('tr'); if (tr) tr.oninput = e => { const v = +e.target.value; S.type==='leave' ? S.t = v : S.arrive = v; renderAll(true); };
  $('chg-from').onclick = () => { const saved = PLACES.filter(p=>p.saved); const i = saved.findIndex(p=>p.id===S.from); S.from = saved[(i+1)%saved.length].id; renderAll(); };
  const r = $('remind'); if (r) r.onclick = () => { r.textContent = 'Reminder set'; };
  const sv = $('a-save'); if (sv) sv.onclick = () => { sv.lastChild.textContent = 'Saved'; };
}

function renderAll(keepFocus){
  const active = keepFocus ? document.activeElement?.id : null;
  drawRoute(); renderCard(); renderMarkers(); renderLayers();
  if (active && $(active)) $(active).focus();
}

/* ---------- Search ---------- */
const q = $('q'), sugg = $('sugg');
let actIdx = 0, lastList = [];
function showSugg(){
  const s = q.value.trim().toLowerCase();
  const list = PLACES.filter(p => !s || (p.name+' '+p.sub).toLowerCase().includes(s));
  lastList = list; actIdx = 0;
  if (!list.length){ sugg.innerHTML = `<h4>No places match "${q.value}"</h4>`; sugg.hidden = false; return; }
  const saved = list.filter(p=>p.saved), other = list.filter(p=>!p.saved);
  const item = (p,i) => `<button data-i="${i}" class="${i===0?'act':''}"><span class="si">${ICON[p.icon||'pin']}</span><span><b>${p.name}</b><span class="s">${p.sub}</span></span></button>`;
  let i = 0, h = '';
  if (saved.length) h += '<h4>Saved</h4>' + saved.map(p=>item(p,i++)).join('');
  if (other.length) h += `<h4>${s ? 'Places' : 'Popular in Bangkok'}</h4>` + other.map(p=>item(p,i++)).join('');
  lastList = [...saved, ...other];
  sugg.innerHTML = h; sugg.hidden = false;
}
q.addEventListener('focus', showSugg);
q.addEventListener('input', showSugg);
q.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){ e.preventDefault(); actIdx = (actIdx + (e.key==='ArrowDown'?1:-1) + lastList.length) % lastList.length; sugg.querySelectorAll('button').forEach((b,i)=>b.classList.toggle('act', i===actIdx)); }
  if (e.key === 'Enter' && lastList[actIdx]){ pick(lastList[actIdx]); }
  if (e.key === 'Escape'){ sugg.hidden = true; q.blur(); }
});
sugg.addEventListener('mousedown', e => { const b = e.target.closest('button[data-i]'); if (b){ e.preventDefault(); pick(lastList[+b.dataset.i]); } });
function pick(p){ sugg.hidden = true; q.value = p.name; q.blur(); select({...p}); }
document.addEventListener('pointerdown', e => { if (!e.target.closest('.search')) sugg.hidden = true; });

/* ---------- Map gestures ---------- */
let drag = null;
svg.addEventListener('pointerdown', e => { drag = {x:e.clientX, y:e.clientY, tx:S.view.tx, ty:S.view.ty, moved:false}; svg.setPointerCapture(e.pointerId); });
svg.addEventListener('pointermove', e => { if (!drag) return; const dx = e.clientX-drag.x, dy = e.clientY-drag.y; if (!drag.moved && Math.hypot(dx,dy) > 5){ drag.moved = true; svg.classList.add('dragging'); } if (drag.moved){ S.view.tx = drag.tx+dx; S.view.ty = drag.ty+dy; applyView(); } });
svg.addEventListener('pointerup', e => { if (drag && !drag.moved){ const w = toWorld(e.clientX, e.clientY); q.value=''; selectAt(w.x, w.y); } drag = null; svg.classList.remove('dragging'); });
svg.addEventListener('wheel', e => { e.preventDefault(); zoomAt(Math.exp(-e.deltaY*.0015), e.clientX, e.clientY); }, {passive:false});
markers.addEventListener('click', e => { const b = e.target.closest('[data-place]'); if (b){ q.value=''; select({...PLACES.find(p=>p.id===b.dataset.place)}); } });
$('zin').onclick = () => zoomAt(1.4, innerWidth/2, innerHeight/2);
$('zout').onclick = () => zoomAt(1/1.4, innerWidth/2, innerHeight/2);
$('compass').onclick = fitView;
$('locate').onclick = () => { const o = origin(); S.view.k = Math.max(S.view.k, 1.2); const s = toScreen(o.x,o.y); S.view.tx += (isPhone()?innerWidth/2:innerWidth/2+ (S.sel?190:0)) - s.x; S.view.ty += innerHeight*.45 - s.y; applyView(); };
$('layer').onclick = () => { S.sat = !S.sat; renderLayers(); };
$('l-traffic').onclick = () => { S.traffic = !S.traffic; renderLayers(); };
$('l-rain').onclick = () => { S.rain = !S.rain; renderLayers(); };
$('l-rail').onclick = () => { S.rail = !S.rail; renderLayers(); };
$('handle').onclick = () => { S.sheetFull = !S.sheetFull; $('card').classList.toggle('peek', !S.sheetFull); };
addEventListener('resize', () => { placeOverlays(); });

fitView(); renderAll();
})();
</script>
